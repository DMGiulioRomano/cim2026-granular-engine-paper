# =============================================================================
# ex3a_range — Gemello A: l'AMPIEZZA della deviazione
#
# Parametro mostrato:  pointer.offset_range 0 -> 0.35 (envelope).
#                      dephase ASSENTE: con range esplicito e senza dephase il
#                      gate e' "always" -> OGNI grano devia, e cio' che cresce
#                      nel tempo e' l'AMPIEZZA della deviazione.
# Andamento atteso:    linea orizzontale (freeze su vocale) -> CUNEO che si
#                      allarga, riempito in modo uniforme; nessuna linea
#                      centrale privilegiata (tutti i grani sono dentro la
#                      banda corrente, nessuno "in linea").
# Gemello di:          ex_mask_dephase. Stessa base (freeze a 0.5), stessa
#                      banda massima (0.35 -> +-0.175 attorno al centro,
#                      campionamento uniforme = centro +- range/2).
#                      I due file differiscono SOLO per dove sta l'envelope:
#                      qui sull'ampiezza, la' sulla probabilita'.
# Riproducibilita':    NON bit-identico (campionamento uniforme per-grano non
#                      seminato). L'andamento e' invariante: il cuneo.
#
# Lettura in partitura: confrontare con il gemello B a meta' durata —
#   qui:  banda stretta (+-0.0875) riempita uniformemente, senza centro.
#   la':  linea centrale netta + ~50% di grani sparsi sull'intera banda.
#   E' la dimostrazione visiva che ampiezza e probabilita' della deviazione
#   sono due assi indipendenti del controllo.
# =============================================================================

composition:
  title: "ex3a_range"

streams:
  - stream_id: "mask_range"
    onset: 0.0
    duration: 12.0
    sample: "weNeedToTalkAboutIt.wav"
    time_mode: normalized
    # Base condivisa dai due gemelli: lettura congelata su un punto.
    # start: tarare su ascolto perche' 0.5 cada su una vocale.
    pointer:
      start: 0.5
      speed_ratio: 0.0
      # La sola variabile dell'esempio:
      offset_range: [[0, 0.0], [1, 0.35]]
